# Dependency checks on every push and pull request: known security advisories, abandoned
# (unmaintained) or yanked crates, and crates from anywhere other than crates.io.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory shows up even when nothing changes here.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
