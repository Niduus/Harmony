# Builds Harmony.exe and Harmony-Setup.exe on Windows, signs the setup, and publishes them as a
# GitHub release. Installed copies of Harmony find that release and install it (see src/updates.rs).
#
# Runs on every push to main that changes code (docs-only pushes are skipped), and by hand from
# the Actions tab. Pull requests build and test, and upload the setup as an artifact, but never
# publish a release.
#
# Release tags are harmony-v<MAJOR>.<MINOR>.<run number>, from the version in Cargo.toml, so every
# build is newer than the one before it.
#
# Until the update-signing key is set up (update-key.pub committed and the Actions secret
# HARMONY_SIGNING_KEY added), each push to main publishes an unsigned TEST build instead:
# a pre-release tagged harmony-test-<run> with Harmony-Setup.exe and harmony-keygen.exe. Its exe
# is a local build, and installed copies of Harmony never install a test release, so it can't
# start an update chain. Once the key exists, releases are signed harmony-v<version> ones.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Pick the release tag
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([0-9]+)\.([0-9]+)\.[0-9]+"' | Select-Object -First 1
          if (-not $match) { throw "version not found in Cargo.toml" }
          $base = "$($match.Matches[0].Groups[1].Value).$($match.Matches[0].Groups[2].Value)"
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=harmony-v$version" >> $env:GITHUB_OUTPUT

      - name: Check the signing key is set up
        id: key
        shell: pwsh
        env:
          HARMONY_SIGNING_KEY: ${{ secrets.HARMONY_SIGNING_KEY }}
        run: |
          $public = (Get-Content update-key.pub -Raw).Trim()
          $signed = ("${{ github.event_name }}" -ne "pull_request") -and ($public -ne "not-configured") -and [bool]$env:HARMONY_SIGNING_KEY
          "signed=$($signed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $signed -and "${{ github.event_name }}" -ne "pull_request") {
            Write-Host "::warning::No update-signing key yet, so this publishes an unsigned test build. Run harmony-keygen to set the key up."
          }

      - name: Build Harmony.exe
        shell: pwsh
        run: |
          # PR and test builds are local builds: they never try to update themselves.
          $tag = if ("${{ steps.key.outputs.signed }}" -eq "true") { "${{ steps.version.outputs.tag }}" } else { "" }
          powershell -ExecutionPolicy Bypass -File build-exe.ps1 -Tag $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build harmony-keygen.exe
        if: github.event_name != 'pull_request' && steps.key.outputs.signed != 'true'
        shell: pwsh
        run: |
          cargo build --release --bin harmony-keygen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\harmony-keygen.exe harmony-keygen.exe

      - name: Get the WebView2 installer
        shell: pwsh
        run: |
          # Run by the setup only on PCs that don't have the runtime yet.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile build\MicrosoftEdgeWebview2Setup.exe

      - name: Build Harmony-Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DMyVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build\installer\Harmony-Setup.exe Harmony-Setup.exe

      - name: Upload the PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-Setup
          path: Harmony-Setup.exe

      - name: Sign the setup
        if: steps.key.outputs.signed == 'true'
        shell: pwsh
        env:
          HARMONY_SIGNING_KEY: ${{ secrets.HARMONY_SIGNING_KEY }}
        run: |
          # harmony-sign refuses to write a signature that doesn't verify against update-key.pub.
          cargo run --release --quiet --bin harmony-sign -- Harmony-Setup.exe "${{ steps.version.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write release notes
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $previous = git describe --tags --match "harmony-v*" --abbrev=0 2>$null
          if ($LASTEXITCODE -eq 0 -and $previous) {
            $log = git log "$previous..HEAD" --format="- %s"
          } else {
            $log = git log -n 15 --format="- %s"
          }
          if (-not $log) { $log = "- Rebuilt Harmony." }
          $log | Set-Content -Path notes.md -Encoding utf8

      - name: Publish the release
        if: steps.key.outputs.signed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}" Harmony-Setup.exe Harmony-Setup.exe.sig
          --title "Harmony ${{ steps.version.outputs.version }}"
          --notes-file notes.md
          --target "${{ github.sha }}"

      - name: Publish an unsigned test build
        if: github.event_name != 'pull_request' && steps.key.outputs.signed != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $intro = @(
            "**Unsigned test build.** It installs and runs normally, but it never updates itself.",
            "",
            "To turn on signed releases and auto-updates once: download harmony-keygen.exe, double-click it, and follow the two steps it shows.",
            ""
          )
          ($intro + (Get-Content notes.md)) | Set-Content -Path notes.md -Encoding utf8
          gh release create "harmony-test-$env:GITHUB_RUN_NUMBER" Harmony-Setup.exe harmony-keygen.exe `
            --prerelease `
            --title "Harmony test build ${{ steps.version.outputs.version }} (unsigned)" `
            --notes-file notes.md `
            --target "${{ github.sha }}"
