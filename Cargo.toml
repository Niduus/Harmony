[package]
name = "harmony"
# The app version. The release workflow tags builds harmony-v<major>.<minor>.<run number>.
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Harmony: a fast native Discord client"
publish = false
default-run = "Harmony"

[[bin]]
name = "Harmony"
path = "src/main.rs"

# Release tooling: make the update-signing key once, and sign each release in CI.
[[bin]]
name = "harmony-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "harmony-sign"
path = "src/bin/sign.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
anyhow = "1"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
# The built exe serves the UI from inside itself (no dev server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
